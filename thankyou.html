<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담 신청 완료 - ReadMaster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif; background: #eff6ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .box { background: #ffffff; border-radius: 16px; padding: 56px 40px; max-width: 460px; margin: 20px; text-align: center; box-shadow: 0 8px 30px rgba(15,46,90,.08); }
  .icon { width: 72px; height: 72px; border-radius: 50%; background: #dbeafe; display: flex; align-items: center; justify-content: center; font-size: 34px; margin: 0 auto 24px; }
  h1 { color: #0f2e5a; font-size: 26px; margin-bottom: 14px; letter-spacing: -0.5px; }
  p { color: #4b5563; font-size: 16px; margin-bottom: 8px; }
  .back { display: inline-block; margin-top: 28px; background: #1d4ed8; color: #fff; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; }
  .back:hover { background: #0f2e5a; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">✅</div>
    <h1>상담 신청이 접수되었습니다</h1>
    <p>1영업일 내에 담당자가 연락드리겠습니다.</p>
    <p style="font-size:14px;color:#9ca3af;">등록해 주신 연락처로 상세 안내를 드립니다.</p>
    <a class="back" href="/">첫 화면으로</a>
  </div>
</body>
</html>
